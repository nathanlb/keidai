# Torii gateway configuration — loaded at boot, no database required.
#
# Shapes match @keidai/shared (ToriiConfig, ServerConfig, CredentialConfig,
# GroupDefinitionConfig, OAuthProviderConfig).
# Env refs use ${env:VAR} and are resolved before validation.
#
# Agent identity lives in Fuda — this file is operator-owned deployment config only.

oauth_providers:
  github:
    token_url: https://github.com/login/oauth/access_token
    client_id: ${env:GITHUB_CLIENT_ID}
    client_secret: ${env:GITHUB_CLIENT_SECRET}
    scopes: [repo]

  notion:
    authorize_url: https://api.notion.com/v1/oauth/authorize
    token_url: https://api.notion.com/v1/oauth/token
    client_id: ${env:NOTION_CLIENT_ID}
    client_secret: ${env:NOTION_CLIENT_SECRET}
    scopes: []

  google:
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    client_id: ${env:GOOGLE_CLIENT_ID}
    client_secret: ${env:GOOGLE_CLIENT_SECRET}
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/gmail.compose
    authorize_params:
      access_type: offline
      prompt: consent

servers:
  - name: github
    transport:
      type: http
      url: https://api.githubcopilot.com/mcp/
    credential:
      strategy: user_oauth
      provider: github

  - name: stripe
    transport:
      type: http
      url: https://mcp.stripe.com
    credential:
      strategy: service_key
      key: ${env:STRIPE_RESTRICTED_KEY}

  - name: deepwiki
    transport:
      type: http
      url: https://mcp.deepwiki.com/mcp
    credential:
      strategy: none

# Group definitions are Torii's RBAC vocabulary. Fuda assigns group names to
# agents; Torii defines what each grants. Unknown groups on a principal fail closed.
groups:
  - name: agents
    description: Default agent access for registered workloads
    permissions:
      - server: github
        tools:
          - search_issues
          - get_file_contents
      - server: stripe
        tools:
          - list_customers
      - server: deepwiki
        tools:
          - read_wiki_structure

# Optional: tools that require human approval before Torii proxies upstream,
# keyed by Fuda agent id.
# gated_tools:
#   agent-catalog-01:
#     - github.create_issue
