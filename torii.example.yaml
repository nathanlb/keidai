# Torii gateway configuration — loaded at boot, no database required.
#
# Shapes match @keidai/shared (ToriiConfig, ServerConfig, CredentialConfig,
# GroupDefinitionConfig, OAuthProviderConfig, AgentRegistrationConfig).
# Env refs use ${env:VAR} and are resolved before validation.

oauth_providers:
  github:
    token_url: https://github.com/login/oauth/access_token
    client_id: ${env:GITHUB_CLIENT_ID}
    client_secret: ${env:GITHUB_CLIENT_SECRET}
    scopes: [repo]

  notion:
    authorize_url: https://api.notion.com/v1/oauth/authorize
    token_url: https://api.notion.com/v1/oauth/token
    client_id: ${env:NOTION_CLIENT_ID}
    client_secret: ${env:NOTION_CLIENT_SECRET}
    scopes: []

  google:
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    client_id: ${env:GOOGLE_CLIENT_ID}
    client_secret: ${env:GOOGLE_CLIENT_SECRET}
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/gmail.compose
    authorize_params:
      access_type: offline
      prompt: consent

servers:
  - name: github
    transport:
      type: http
      url: https://api.githubcopilot.com/mcp/
    credential:
      strategy: user_oauth
      provider: github

  - name: stripe
    transport:
      type: http
      url: https://mcp.stripe.com
    credential:
      strategy: service_key
      key: ${env:STRIPE_RESTRICTED_KEY}

  - name: deepwiki
    transport:
      type: http
      url: https://mcp.deepwiki.com/mcp
    credential:
      strategy: none

# Group definitions are Torii's RBAC vocabulary. Fuda assigns group names to
# agents; Torii defines what each grants. Unknown groups on a principal fail closed.
groups:
  - name: agents
    description: Default agent access for registered workloads
    permissions:
      - server: github
        tools:
          - search_issues
          - get_file_contents
      - server: stripe
        tools:
          - list_customers
      - server: deepwiki
        tools:
          - read_wiki_structure

# Owner used for boot-time backend connections and catalog refresh.
# Deployment config — not derived from agent declarations.
boot_owner_id: user-alice

# Agent registrations bind validated credential subjects to internal principals.
# owner_id is fixed at registration — never taken from inbound requests.
# Optional inbound_token enables Authorization: Bearer auth for local/demo agents.
agents:
  - subject:
      kind: k8s_service_account
      namespace: torii-agents
      service_account: catalog-agent
    agent_id: agent-catalog-01
    owner_id: user-alice
    groups:
      - agents
