services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keidai-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  fuda:
    image: keidai-fuda:latest
    build:
      context: .
      dockerfile: apps/fuda/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - apps/fuda/.env
    environment:
      FUDA_HOST: 0.0.0.0
      FUDA_PORT: "3300"
      FUDA_DATABASE_URL: postgres://fuda:${POSTGRES_PASSWORD:-keidai-local}@postgres:5432/fuda
      # JWT `iss` claim — logical identity, not the bind address (FUDA_HOST is 0.0.0.0).
      # Override via root .env when you need a different issuer (e.g. https://fuda.local).
      FUDA_ISSUER: ${FUDA_ISSUER:-http://fuda:3300}
      # Mount apps/fuda/keys/dev.pem (see apps/fuda/README.md).
      FUDA_SIGNING_KEYS: "dev=/app/keys/dev.pem"
      FUDA_SIGNING_KID: "dev"
      # Shared secret Shaiden presents; allowed subjects resolve to shaiden-runner.
      FUDA_STATIC_SUBJECT_TOKEN: ${SHAIDEN_BEARER:-local-dev-secret}
      # Pin container path so host-relative FUDA_OPERATORS_PATH from apps/fuda/.env
      # cannot break in-container boot (mirrors k8s ConfigMap mount).
      FUDA_OPERATORS_PATH: /app/operators/operators.yaml
    volumes:
      - ./apps/fuda/keys:/app/keys:ro
      - ./deploy/operators.example.yaml:/app/operators/operators.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.FUDA_PORT || 3300) + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  torii:
    image: keidai-torii:latest
    build:
      context: .
      dockerfile: apps/torii/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      fuda:
        condition: service_healthy
    env_file:
      - .env
      - apps/torii/.env
    environment:
      TORII_CONFIG_PATH: /app/torii.demo.yaml
      TORII_DATABASE_URL: postgres://torii:${POSTGRES_PASSWORD:-keidai-local}@postgres:5432/torii
      TORII_FUDA_ISSUER: ${FUDA_ISSUER:-http://fuda:3300}
      TORII_FUDA_JWKS_URI: http://fuda:3300/.well-known/jwks.json
      # Public operator edge (keidai-ui BFF), not Torii's listen port.
      TORII_GATEWAY_BASE_URL: http://localhost:3000
      # Pin container path so a host-relative TORII_OPERATORS_PATH from
      # apps/torii/.env cannot break in-container boot (mirrors k8s ConfigMap mount).
      TORII_OPERATORS_PATH: /app/operators/operators.yaml
    volumes:
      - ./apps/torii/torii.demo.yaml:/app/torii.demo.yaml:ro
      - ./deploy/operators.example.yaml:/app/operators/operators.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
            "fetch('http://127.0.0.1:' + (process.env.TORII_PORT || 3100) + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  shaiden:
    image: keidai-shaiden:latest
    build:
      context: .
      dockerfile: apps/shaiden/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      fuda:
        condition: service_healthy
      torii:
        condition: service_healthy
    env_file:
      - .env
      - apps/shaiden/.env
    environment:
      SHAIDEN_BEARER: ${SHAIDEN_BEARER:-local-dev-secret}
      FUDA_URL: http://fuda:3300
      TORII_MCP_URL: http://torii:3100/mcp
      SHAIDEN_HOST: 0.0.0.0
      SHAIDEN_PORT: "3200"
      SHAIDEN_DATABASE_URL: postgres://shaiden:${POSTGRES_PASSWORD:-keidai-local}@postgres:5432/shaiden

  keidai-ui:
    image: keidai-keidai-ui:latest
    build:
      context: .
      dockerfile: apps/keidai-ui/Dockerfile
    depends_on:
      fuda:
        condition: service_healthy
      torii:
        condition: service_healthy
      shaiden:
        condition: service_started
    env_file:
      - .env
      - apps/keidai-ui/.env
    environment:
      KEIDAI_UI_HOST: 0.0.0.0
      KEIDAI_UI_PORT: "3000"
      KEIDAI_UI_TORII_URL: http://torii:3100
      KEIDAI_UI_FUDA_URL: http://fuda:3300
      KEIDAI_UI_SHAIDEN_URL: http://shaiden:3200
      # Pin edge/session env so host .env relative paths / Secure-cookie
      # defaults cannot break http://localhost:3000 (mirrors k8s ConfigMap).
      KEIDAI_GOOGLE_REDIRECT_URI: http://localhost:3000/auth/callback
      KEIDAI_COOKIE_SECURE: "false"
      KEIDAI_OPERATORS_PATH: /app/operators/operators.yaml
    volumes:
      - ./deploy/operators.example.yaml:/app/operators/operators.yaml:ro
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.KEIDAI_UI_PORT || 3000) + '/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
