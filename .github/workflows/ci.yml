name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - run: node scripts/check-versions.mjs
      - run: node --test scripts/lib/release-changelog.test.mjs

  packages:
    uses: ./.github/workflows/with-postgres.yml
    with:
      command: |
        pnpm turbo run build test --filter=@keidai/shared --filter=@keidai/postgres
        pnpm turbo run build typecheck --filter=@keidai/ui

  torii:
    uses: ./.github/workflows/with-postgres.yml
    with:
      command: pnpm turbo run build test --filter=@keidai/torii...

  fuda:
    uses: ./.github/workflows/with-postgres.yml
    with:
      command: pnpm turbo run build test --filter=@keidai/fuda...

  shaiden:
    uses: ./.github/workflows/with-postgres.yml
    with:
      command: pnpm turbo run build test --filter=@keidai/shaiden...

  keidai-ui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter=@keidai/keidai-ui...
      - run: pnpm turbo run lint --filter=@keidai/keidai-ui
      - run: pnpm --filter @keidai/keidai-ui exec vitest run --project unit
      - run: pnpm --filter @keidai/keidai-ui run test:server

  keidai-ui-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @keidai/keidai-ui exec playwright install chromium
      - run: pnpm turbo run build --filter=@keidai/keidai-ui...
      - run: pnpm --filter @keidai/keidai-ui exec vitest run --project browser
      - run: pnpm --filter @keidai/keidai-ui run test:e2e

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deploy/k8s/chart \
            -f deploy/k8s/chart/values-kind.yaml \
            -f deploy/k8s/chart/values-secrets.example.yaml
          helm template keidai deploy/k8s/chart -n keidai \
            -f deploy/k8s/chart/values-kind.yaml \
            -f deploy/k8s/chart/values-secrets.example.yaml \
            >/dev/null
          helm template keidai deploy/k8s/chart -n keidai \
            -f deploy/k8s/chart/values.yaml \
            -f deploy/k8s/chart/values-secrets.example.yaml \
            --set publicUrl=https://keidai.example.com \
            >/dev/null
          if helm template keidai deploy/k8s/chart -n keidai \
            -f deploy/k8s/chart/values.yaml \
            -f deploy/k8s/chart/values-secrets.example.yaml \
            >/dev/null 2>/tmp/keidai-helm-empty-publicurl.err; then
            echo "helm template with empty publicUrl should fail" >&2
            exit 1
          fi
          grep -q publicUrl /tmp/keidai-helm-empty-publicurl.err
          helm package deploy/k8s/chart --destination "${RUNNER_TEMP}"
