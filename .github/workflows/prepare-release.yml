# Opens a Release PR. Requires fine-grained PAT in RELEASE_GITHUB_TOKEN
# (contents: write, pull requests: write).
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for the next release
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor
      notes:
        description: Optional context for the changelog LLM
        required: false
        type: string
      model:
        description: OpenRouter model id
        required: false
        default: ~deepseek/deepseek-v4-flash-latest
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - uses: ./.github/actions/setup

      - name: Generate changeset
        run: |
          ARGS=(--bump "${{ inputs.bump }}" --model "${{ inputs.model }}")
          if [ -n "${{ inputs.notes }}" ]; then
            ARGS+=(--notes "${{ inputs.notes }}")
          fi
          node scripts/prepare-release-changeset.mjs "${ARGS[@]}"
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_RELEASE_API_KEY }}

      - name: Apply version bump
        run: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="$(node -p "require('./apps/fuda/package.json').version")"
          BRANCH="chore/release-v${VERSION}-${{ github.run_id }}"
          git checkout -b "${BRANCH}"
          git add -- apps packages deploy/k8s/chart/Chart.yaml .changeset
          git commit -m "chore: release ${VERSION}"
          git push origin "HEAD:${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Release ${VERSION}" \
            --body "Platform release ${VERSION} (${{ inputs.bump }}). Review the changelog, then merge to tag \`v${VERSION}\` and publish GHCR images."
