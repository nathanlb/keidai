# Opens a Release PR. Requires fine-grained PAT in RELEASE_GITHUB_TOKEN
# (contents: write, pull requests: write).
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump. patch includes chore commits (dependency upgrades); minor/major skip those.
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor
      notes:
        description: Optional markdown prepended to the commit-derived changelog
        required: false
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - uses: ./.github/actions/setup

      - name: Generate changeset
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          ARGS=(--bump "${{ inputs.bump }}" --pr-body-out "${RUNNER_TEMP}/release-notes.md")
          if [ -n "${RELEASE_NOTES}" ]; then
            ARGS+=(--notes "${RELEASE_NOTES}")
          fi
          node scripts/prepare-release-changeset.mjs "${ARGS[@]}"

      - name: Apply version bump
        run: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="$(node -p "require('./apps/fuda/package.json').version")"
          BRANCH="chore/release-v${VERSION}-${{ github.run_id }}"
          git checkout -b "${BRANCH}"
          git add -- apps packages deploy/k8s/chart/Chart.yaml .changeset
          git commit -m "chore: release ${VERSION}"
          git push origin "HEAD:${BRANCH}"
          {
            echo "Platform release ${VERSION} (${BUMP})."
            echo
            echo "Changelog is generated from conventional commits since the last \`v*\` tag. Review it, then merge to tag \`v${VERSION}\` and publish GHCR images plus the Helm chart."
            echo
            cat "${RUNNER_TEMP}/release-notes.md"
          } > "${RUNNER_TEMP}/pr-body.md"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Release ${VERSION}" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
