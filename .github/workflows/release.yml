# After a Release PR merges (versions already bumped, no pending changesets),
# tag v{semver}. Push that tag with RELEASE_GITHUB_TOKEN — GitHub does not
# start other workflows for events created by GITHUB_TOKEN, so a default-token
# tag push never runs publish-images.yml.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: bash scripts/release-tag.sh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
