name: Publish images

on:
  push:
    tags:
      - "v*"
  # Re-publish an existing tag (e.g. after a GITHUB_TOKEN tag push that
  # GitHub suppressed). Run against the tag ref, not a branch.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: keidai-fuda
            dockerfile: apps/fuda/Dockerfile
            package: apps/fuda/package.json
          - image: keidai-torii
            dockerfile: apps/torii/Dockerfile
            package: apps/torii/package.json
          - image: keidai-shaiden
            dockerfile: apps/shaiden/Dockerfile
            package: apps/shaiden/package.json
          - image: keidai-ui
            dockerfile: apps/keidai-ui/Dockerfile
            package: apps/keidai-ui/package.json
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image coordinates
        id: version
        run: |
          TAG="$(node -p "require('./${{ matrix.package }}').version")"
          REF_TAG="${GITHUB_REF_NAME#v}"
          if [ "${REF_TAG}" != "${TAG}" ]; then
            echo "Git tag v${REF_TAG} does not match package.json version ${TAG}" >&2
            exit 1
          fi
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ matrix.image }}:${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
