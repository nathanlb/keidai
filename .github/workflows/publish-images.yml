name: Publish images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: keidai-fuda
            dockerfile: apps/fuda/Dockerfile
          - image: keidai-torii
            dockerfile: apps/torii/Dockerfile
          - image: keidai-shaiden
            dockerfile: apps/shaiden/Dockerfile
          - image: keidai-ui
            dockerfile: apps/keidai-ui/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image coordinates
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ matrix.image }}:${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
