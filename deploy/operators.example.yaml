# Platform operators — optional allowlist and boot seed.
#
# When KEIDAI_OPERATORS_PATH points at this file, only these Google identities
# can sign in, and each keeps its owner_id. Omit the file to provision any
# account the configured OIDC issuer accepts.
#
# Fuda (FUDA_OPERATORS_PATH) upserts these owner ids at boot and does not
# delete anyone else unless FUDA_OPERATORS_RECONCILE=strict.
# Torii (TORII_OPERATORS_PATH) validates the file and leaves OAuth grants in
# place unless TORII_OPERATORS_RECONCILE=strict.
#
# Invariant when the file is used: one google_sub (and/or google_email) ↔ one owner_id.
# Display name/avatar come from the IdP at login, not from this file.

operators:
  - owner_id: nathan-lafranceb
    # Prefer google_sub once known (stable). Email is useful for first bootstrap.
    google_email: nathan.lafranceb@gmail.com
    # google_sub: "1182..."
