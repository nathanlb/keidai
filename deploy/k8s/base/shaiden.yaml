apiVersion: apps/v1
kind: Deployment
metadata:
  name: shaiden
  namespace: keidai
  labels:
    app: shaiden
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: shaiden
  template:
    metadata:
      labels:
        app: shaiden
    spec:
      serviceAccountName: shaiden
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h postgres -U postgres; do sleep 1; done",
            ]
      containers:
        - name: shaiden
          image: keidai-shaiden:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3200
              name: http
          envFrom:
            - configMapRef:
                name: shaiden-env
            - secretRef:
                name: keidai-secrets
          volumeMounts:
            - name: fuda-audience-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: fuda-audience-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: fuda
                  expirationSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: shaiden
  namespace: keidai
spec:
  type: ClusterIP
  selector:
    app: shaiden
  ports:
    - name: http
      port: 3200
      targetPort: http
