apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuda
  namespace: keidai
  labels:
    app: fuda
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fuda
  template:
    metadata:
      labels:
        app: fuda
    spec:
      serviceAccountName: fuda
      securityContext:
        fsGroup: 1001
      containers:
        - name: fuda
          image: keidai-fuda:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3300
              name: http
          envFrom:
            - configMapRef:
                name: fuda-config
            - secretRef:
                name: keidai-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: signing-key
              mountPath: /app/keys
              readOnly: true
            - name: operators
              mountPath: /app/operators
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fuda-data
        - name: signing-key
          secret:
            secretName: fuda-signing
            items:
              - key: dev.pem
                path: dev.pem
                mode: 0400
        - name: operators
          configMap:
            name: keidai-operators
---
apiVersion: v1
kind: Service
metadata:
  name: fuda
  namespace: keidai
spec:
  type: ClusterIP
  selector:
    app: fuda
  ports:
    - name: http
      port: 3300
      targetPort: http
