apiVersion: apps/v1
kind: Deployment
metadata:
  name: keidai-ui
  namespace: keidai
  labels:
    app: keidai-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keidai-ui
  template:
    metadata:
      labels:
        app: keidai-ui
    spec:
      serviceAccountName: keidai-ui
      containers:
        - name: keidai-ui
          image: keidai-keidai-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: keidai-ui-env
            - secretRef:
                name: keidai-secrets
          volumeMounts:
            - name: operators
              mountPath: /app/operators
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: operators
          configMap:
            name: keidai-operators
---
apiVersion: v1
kind: Service
metadata:
  name: keidai-ui
  namespace: keidai
spec:
  # Overlays set exposure (kind hostPort, OrbStack LoadBalancer, etc.).
  type: ClusterIP
  selector:
    app: keidai-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
