apiVersion: v1
kind: ConfigMap
metadata:
  name: torii-env
  namespace: keidai
data:
  TORII_HOST: "0.0.0.0"
  TORII_PORT: "3100"
  TORII_CONFIG_PATH: /app/torii.demo.yaml
  TORII_DB_PATH: /app/data/torii.db
  TORII_FUDA_ISSUER: http://fuda:3300
  TORII_FUDA_JWKS_URI: http://fuda:3300/.well-known/jwks.json
  # Public BFF origin for OAuth initiate callbacks. Overlays may patch this.
  TORII_GATEWAY_BASE_URL: http://localhost:3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shaiden-env
  namespace: keidai
data:
  SHAIDEN_HOST: "0.0.0.0"
  SHAIDEN_PORT: "3200"
  SHAIDEN_DB_PATH: /app/data/shaiden.db
  FUDA_URL: http://fuda:3300
  TORII_MCP_URL: http://torii:3100/mcp
  SHAIDEN_SUBJECT_TOKEN_FILE: /var/run/secrets/tokens/token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keidai-ui-env
  namespace: keidai
data:
  KEIDAI_UI_HOST: "0.0.0.0"
  KEIDAI_UI_PORT: "3000"
  KEIDAI_UI_TORII_URL: http://torii:3100
  KEIDAI_UI_FUDA_URL: http://fuda:3300
  KEIDAI_UI_SHAIDEN_URL: http://shaiden:3200
  KEIDAI_GOOGLE_REDIRECT_URI: http://localhost:3000/auth/callback
  KEIDAI_COOKIE_SECURE: "false"
  KEIDAI_OPERATORS_PATH: /app/operators/operators.yaml
