apiVersion: apps/v1
kind: Deployment
metadata:
  name: torii
  namespace: keidai
  labels:
    app: torii
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: torii
  template:
    metadata:
      labels:
        app: torii
    spec:
      serviceAccountName: torii
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h postgres -U postgres; do sleep 1; done",
            ]
      containers:
        - name: torii
          image: keidai-torii:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3100
              name: http
          envFrom:
            - configMapRef:
                name: torii-env
            - secretRef:
                name: keidai-secrets
          volumeMounts:
            - name: config
              mountPath: /app/torii.demo.yaml
              subPath: torii.demo.yaml
              readOnly: true
            - name: operators
              mountPath: /app/operators
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: torii-config
        - name: operators
          configMap:
            name: keidai-operators
---
apiVersion: v1
kind: Service
metadata:
  name: torii
  namespace: keidai
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: torii
  ports:
    - name: http
      port: 3100
      targetPort: http
