apiVersion: v1
kind: ConfigMap
metadata:
  name: fuda-config
  namespace: keidai
data:
  FUDA_HOST: "0.0.0.0"
  FUDA_PORT: "3300"
  FUDA_DB_PATH: /app/data/fuda.db
  FUDA_LISTEN_GROUPS: public,agent,management
  # Logical issuer claim (must match Torii TORII_FUDA_ISSUER).
  FUDA_ISSUER: http://fuda:3300
  FUDA_SIGNING_KEYS: "dev=/app/keys/dev.pem"
  FUDA_SIGNING_KID: "dev"
  # Default local issuer; overlays / up.sh refresh from cluster OIDC discovery.
  FUDA_K8S_SA_OIDC_ISSUER: https://kubernetes.default.svc.cluster.local
  FUDA_K8S_SA_OIDC_AUDIENCE: fuda
  FUDA_K8S_SA_OIDC_JWKS_URI: https://kubernetes.default.svc/openid/v1/jwks
  FUDA_K8S_SA_OIDC_SUBJECT_MAPPINGS: keidai/shaiden=shaiden-runner
  NODE_EXTRA_CA_CERTS: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
