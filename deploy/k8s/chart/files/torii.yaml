# Gateway config mounted into Torii. Override with values.torii.config (inline)
# or replace chart/files/torii.yaml. Keep in sync with apps/torii/torii.demo.yaml
# when changing demo backends.
#
# Link OAuth providers via the keidai-ui OAuth providers screen before running
# demos. Register provider callback URLs as
# {publicUrl}/oauth/callback/{provider}.

oauth_providers:
  github:
    token_url: https://github.com/login/oauth/access_token
    client_id: ${env:GITHUB_CLIENT_ID}
    client_secret: ${env:GITHUB_CLIENT_SECRET}
    scopes: [repo, read:user]

  notion:
    authorize_url: https://mcp.notion.com/authorize
    token_url: https://mcp.notion.com/token
    registration_endpoint: https://mcp.notion.com/register
    scopes: []

  google:
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    client_id: ${env:GOOGLE_CLIENT_ID}
    client_secret: ${env:GOOGLE_CLIENT_SECRET}
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/gmail.compose
      - https://www.googleapis.com/auth/gmail.drafts
    authorize_params:
      access_type: offline
      prompt: consent

servers:
  - name: linear
    transport:
      type: http
      url: https://mcp.linear.app/mcp
    credential:
      strategy: service_key
      key: ${env:LINEAR_API_KEY}

  - name: github
    transport:
      type: http
      url: https://api.githubcopilot.com/mcp/
    credential:
      strategy: user_oauth
      provider: github

  - name: notion
    transport:
      type: http
      url: https://mcp.notion.com/mcp
    credential:
      strategy: user_oauth
      provider: notion

  - name: gmail
    transport:
      type: http
      url: https://gmailmcp.googleapis.com/mcp/v1
    credential:
      strategy: user_oauth
      provider: google
