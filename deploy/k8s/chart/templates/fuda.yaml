apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuda
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
    app.kubernetes.io/name: fuda
    app: fuda
spec:
  replicas: {{ .Values.fuda.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: fuda
  template:
    metadata:
      labels:
        app: fuda
      annotations:
        checksum/config: {{ include "keidai.configChecksum" . }}
        checksum/secret: {{ include "keidai.secretChecksum" . }}
    spec:
      serviceAccountName: fuda
      {{- include "keidai.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: wait-postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.postgres.pullPolicy }}
          envFrom:
            - secretRef:
                name: keidai-secrets
          command: ["sh", "-c", {{ include "keidai.appDbWaitCommand" (list . "FUDA_DATABASE_URL") | quote }}]
      containers:
        - name: fuda
          image: {{ include "keidai.image" (list "keidai-fuda" .) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3300
              name: http
          envFrom:
            - configMapRef:
                name: fuda-config
            - secretRef:
                name: keidai-secrets
          volumeMounts:
            - name: signing-key
              mountPath: /app/keys
              readOnly: true
            - name: operators
              mountPath: /app/operators
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: signing-key
          secret:
            secretName: fuda-signing
            items:
              - key: dev.pem
                path: dev.pem
                mode: 0400
        - name: operators
          configMap:
            name: keidai-operators
---
apiVersion: v1
kind: Service
metadata:
  name: fuda
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
    app.kubernetes.io/name: fuda
spec:
  type: ClusterIP
  selector:
    app: fuda
  ports:
    - name: http
      port: 3300
      targetPort: http
