apiVersion: apps/v1
kind: Deployment
metadata:
  name: shaiden
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
    app.kubernetes.io/name: shaiden
    app: shaiden
spec:
  replicas: {{ .Values.shaiden.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: shaiden
  template:
    metadata:
      labels:
        app: shaiden
      annotations:
        checksum/config: {{ include "keidai.configChecksum" . }}
        checksum/secret: {{ include "keidai.secretChecksum" . }}
    spec:
      serviceAccountName: shaiden
      {{- include "keidai.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: wait-postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.postgres.pullPolicy }}
          envFrom:
            - secretRef:
                name: keidai-secrets
          command: ["sh", "-c", {{ include "keidai.appDbWaitCommand" (list . "SHAIDEN_DATABASE_URL") | quote }}]
      containers:
        - name: shaiden
          image: {{ include "keidai.image" (list "keidai-shaiden" .) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3200
              name: http
          envFrom:
            - configMapRef:
                name: shaiden-env
            - secretRef:
                name: keidai-secrets
          volumeMounts:
            - name: fuda-audience-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: fuda-audience-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: fuda
                  expirationSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: shaiden
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
    app.kubernetes.io/name: shaiden
spec:
  type: ClusterIP
  selector:
    app: shaiden
  ports:
    - name: http
      port: 3200
      targetPort: http
