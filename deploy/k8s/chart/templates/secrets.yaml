{{- $existingSecrets := lookup "v1" "Secret" .Release.Namespace "keidai-secrets" }}
{{- $existingSigning := lookup "v1" "Secret" .Release.Namespace "fuda-signing" }}

{{- $postgresPassword := .Values.secrets.postgresPassword | default "" }}
{{- if and (eq $postgresPassword "") $existingSecrets }}
  {{- $postgresPassword = index $existingSecrets.data "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
{{- if eq $postgresPassword "" }}
  {{- fail "secrets.postgresPassword is required on first install (pass via secrets-values.yaml). Refusing to generate a password that would rotate on upgrade." }}
{{- end }}

{{- $sessionSecret := .Values.secrets.keidaiSessionSecret | default "" }}
{{- if and (eq $sessionSecret "") $existingSecrets }}
  {{- $sessionSecret = index $existingSecrets.data "KEIDAI_SESSION_SECRET" | b64dec }}
{{- end }}
{{- if eq $sessionSecret "" }}
  {{- fail "secrets.keidaiSessionSecret is required on first install" }}
{{- end }}
{{- if lt (len $sessionSecret) 32 }}
  {{- fail "secrets.keidaiSessionSecret must be at least 32 characters" }}
{{- end }}

{{- $googleClientId := .Values.secrets.keidaiGoogleClientId | default "" }}
{{- if and (eq $googleClientId "") $existingSecrets }}
  {{- $googleClientId = index $existingSecrets.data "KEIDAI_GOOGLE_CLIENT_ID" | b64dec }}
{{- end }}
{{- if eq $googleClientId "" }}
  {{- fail "secrets.keidaiGoogleClientId is required on first install" }}
{{- end }}

{{- $googleClientSecret := .Values.secrets.keidaiGoogleClientSecret | default "" }}
{{- if and (eq $googleClientSecret "") $existingSecrets }}
  {{- $googleClientSecret = index $existingSecrets.data "KEIDAI_GOOGLE_CLIENT_SECRET" | b64dec }}
{{- end }}
{{- if eq $googleClientSecret "" }}
  {{- fail "secrets.keidaiGoogleClientSecret is required on first install" }}
{{- end }}

{{- $openRouter := .Values.secrets.openRouterApiKey | default "" }}
{{- if and (eq $openRouter "") $existingSecrets }}
  {{- $openRouter = index $existingSecrets.data "OPEN_ROUTER_API_KEY" | b64dec }}
{{- end }}
{{- if eq $openRouter "" }}
  {{- fail "secrets.openRouterApiKey is required on first install" }}
{{- end }}

{{- $bffDisabled := .Values.secrets.bffServiceTokenDisabled | default "" | lower }}
{{- $bffToken := .Values.secrets.bffServiceToken | default "" }}
{{- if and (eq $bffToken "") $existingSecrets }}
  {{- $bffToken = index $existingSecrets.data "BFF_SERVICE_TOKEN" | b64dec }}
{{- end }}
{{- if and (ne $bffDisabled "true") (ne $bffDisabled "1") (ne $bffDisabled "yes") (eq $bffToken "") }}
  {{- fail "secrets.bffServiceToken is required on first install (or set secrets.bffServiceTokenDisabled=true)" }}
{{- end }}

{{- $signingKey := .Values.secrets.fudaSigningKey | default "" }}
{{- if and (eq $signingKey "") $existingSigning }}
  {{- $signingKey = index $existingSigning.data "dev.pem" | b64dec }}
{{- end }}
{{- if eq $signingKey "" }}
  {{- fail "secrets.fudaSigningKey is required on first install (use --set-file secrets.fudaSigningKey=...). Refusing to genRSA in-template (would rotate on every upgrade)." }}
{{- end }}

{{- $linear := .Values.secrets.linearApiKey | default "" }}
{{- if and (eq $linear "") $existingSecrets }}
  {{- $linear = index $existingSecrets.data "LINEAR_API_KEY" | default "" | b64dec }}
{{- end }}
{{- $githubClientId := .Values.secrets.githubClientId | default "" }}
{{- if and (eq $githubClientId "") $existingSecrets }}
  {{- $githubClientId = index $existingSecrets.data "GITHUB_CLIENT_ID" | default "" | b64dec }}
{{- end }}
{{- $githubClientSecret := .Values.secrets.githubClientSecret | default "" }}
{{- if and (eq $githubClientSecret "") $existingSecrets }}
  {{- $githubClientSecret = index $existingSecrets.data "GITHUB_CLIENT_SECRET" | default "" | b64dec }}
{{- end }}
{{- $googleBackendClientId := .Values.secrets.googleClientId | default "" }}
{{- if and (eq $googleBackendClientId "") $existingSecrets }}
  {{- $googleBackendClientId = index $existingSecrets.data "GOOGLE_CLIENT_ID" | default "" | b64dec }}
{{- end }}
{{- $googleBackendClientSecret := .Values.secrets.googleClientSecret | default "" }}
{{- if and (eq $googleBackendClientSecret "") $existingSecrets }}
  {{- $googleBackendClientSecret = index $existingSecrets.data "GOOGLE_CLIENT_SECRET" | default "" | b64dec }}
{{- end }}
{{- $bffDisabledOut := .Values.secrets.bffServiceTokenDisabled | default "" }}
{{- if and (eq $bffDisabledOut "") $existingSecrets }}
  {{- $bffDisabledOut = index $existingSecrets.data "BFF_SERVICE_TOKEN_DISABLED" | default "" | b64dec }}
{{- end }}

{{- $encoded := urlquery $postgresPassword }}
{{- $pgHost := .Values.postgres.host | default "postgres" }}

apiVersion: v1
kind: Secret
metadata:
  name: keidai-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  FUDA_DATABASE_URL: {{ printf "postgres://fuda:%s@%s:5432/fuda" $encoded $pgHost | quote }}
  TORII_DATABASE_URL: {{ printf "postgres://torii:%s@%s:5432/torii" $encoded $pgHost | quote }}
  SHAIDEN_DATABASE_URL: {{ printf "postgres://shaiden:%s@%s:5432/shaiden" $encoded $pgHost | quote }}
  OPEN_ROUTER_API_KEY: {{ $openRouter | quote }}
  LINEAR_API_KEY: {{ $linear | quote }}
  GITHUB_CLIENT_ID: {{ $githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ $githubClientSecret | quote }}
  GOOGLE_CLIENT_ID: {{ $googleBackendClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ $googleBackendClientSecret | quote }}
  KEIDAI_GOOGLE_CLIENT_ID: {{ $googleClientId | quote }}
  KEIDAI_GOOGLE_CLIENT_SECRET: {{ $googleClientSecret | quote }}
  KEIDAI_SESSION_SECRET: {{ $sessionSecret | quote }}
  BFF_SERVICE_TOKEN: {{ $bffToken | quote }}
  BFF_SERVICE_TOKEN_DISABLED: {{ $bffDisabledOut | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: fuda-signing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
type: Opaque
stringData:
  dev.pem: |
{{ $signingKey | nindent 4 }}
