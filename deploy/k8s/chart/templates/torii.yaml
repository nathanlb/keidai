apiVersion: apps/v1
kind: Deployment
metadata:
  name: torii
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
    app.kubernetes.io/name: torii
    app: torii
spec:
  replicas: {{ .Values.torii.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: torii
  template:
    metadata:
      labels:
        app: torii
      annotations:
        checksum/config: {{ include "keidai.configChecksum" . }}
        checksum/secret: {{ include "keidai.secretChecksum" . }}
    spec:
      serviceAccountName: torii
      {{- include "keidai.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: wait-postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.postgres.pullPolicy }}
          envFrom:
            - secretRef:
                name: keidai-secrets
          command: ["sh", "-c", {{ include "keidai.appDbWaitCommand" (list . "TORII_DATABASE_URL") | quote }}]
      containers:
        - name: torii
          image: {{ include "keidai.image" (list "keidai-torii" .) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3100
              name: http
          envFrom:
            - configMapRef:
                name: torii-env
            - secretRef:
                name: keidai-secrets
          volumeMounts:
            - name: config
              mountPath: /app/torii.yaml
              subPath: torii.yaml
              readOnly: true
            - name: operators
              mountPath: /app/operators
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: torii-config
        - name: operators
          configMap:
            name: keidai-operators
---
apiVersion: v1
kind: Service
metadata:
  name: torii
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
    app.kubernetes.io/name: torii
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: torii
  ports:
    - name: http
      port: 3100
      targetPort: http
