{{- $subjects := .Values.fuda.k8sSaOidc.subjects | default "" }}
{{- if eq $subjects "" }}
  {{- $subjects = printf "%s/shaiden" .Release.Namespace }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuda-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
    app.kubernetes.io/name: fuda
data:
  FUDA_HOST: "0.0.0.0"
  FUDA_PORT: "3300"
  FUDA_LISTEN_GROUPS: public,agent,management
  FUDA_ISSUER: http://fuda:3300
  FUDA_SIGNING_KEYS: "dev=/app/keys/dev.pem"
  FUDA_SIGNING_KID: "dev"
  {{- with .Values.fuda.k8sSaOidc.issuer }}
  FUDA_K8S_SA_OIDC_ISSUER: {{ . | quote }}
  {{- end }}
  FUDA_K8S_SA_OIDC_AUDIENCE: {{ .Values.fuda.k8sSaOidc.audience | quote }}
  FUDA_K8S_SA_OIDC_JWKS_URI: {{ .Values.fuda.k8sSaOidc.jwksUri | quote }}
  FUDA_K8S_SA_OIDC_SUBJECTS: {{ $subjects | quote }}
  FUDA_OPERATORS_PATH: /app/operators/operators.yaml
  NODE_EXTRA_CA_CERTS: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  KEIDAI_AUTO_MIGRATE: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: torii-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
    app.kubernetes.io/name: torii
data:
  TORII_HOST: "0.0.0.0"
  TORII_PORT: "3100"
  TORII_CONFIG_PATH: /app/torii.yaml
  TORII_FUDA_ISSUER: http://fuda:3300
  TORII_FUDA_JWKS_URI: http://fuda:3300/.well-known/jwks.json
  TORII_GATEWAY_BASE_URL: {{ include "keidai.publicUrl" . | quote }}
  TORII_OPERATORS_PATH: /app/operators/operators.yaml
  KEIDAI_AUTO_MIGRATE: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shaiden-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
    app.kubernetes.io/name: shaiden
data:
  SHAIDEN_HOST: "0.0.0.0"
  SHAIDEN_PORT: "3200"
  FUDA_URL: http://fuda:3300
  TORII_MCP_URL: http://torii:3100/mcp
  SHAIDEN_SUBJECT_TOKEN_FILE: /var/run/secrets/tokens/token
  KEIDAI_AUTO_MIGRATE: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keidai-ui-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keidai.labels" . | nindent 4 }}
    app.kubernetes.io/name: keidai-ui
data:
  KEIDAI_UI_HOST: "0.0.0.0"
  KEIDAI_UI_PORT: "3000"
  KEIDAI_UI_TORII_URL: http://torii:3100
  KEIDAI_UI_FUDA_URL: http://fuda:3300
  KEIDAI_UI_SHAIDEN_URL: http://shaiden:3200
  KEIDAI_GOOGLE_REDIRECT_URI: {{ printf "%s/auth/callback" (include "keidai.publicUrl" .) | quote }}
  KEIDAI_COOKIE_SECURE: {{ include "keidai.cookieSecure" . | quote }}
  KEIDAI_OPERATORS_PATH: /app/operators/operators.yaml
