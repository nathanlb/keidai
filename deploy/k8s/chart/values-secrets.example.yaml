# Copy to deploy/k8s/secrets-values.yaml (gitignored) or pass equivalent --set /
# --set-file flags. Never commit real secrets.
#
# up.sh generates this file from secrets.env + the signing key + operators file.

operators: |
  operators:
    - owner_id: example-operator
      google_email: you@example.com

secrets:
  postgresPassword: "change-me"
  openRouterApiKey: "replace-me"
  keidaiGoogleClientId: "replace-me.apps.googleusercontent.com"
  keidaiGoogleClientSecret: "replace-me"
  keidaiSessionSecret: "change-me-to-a-long-random-string-32chars-min"
  toriiSecretKey: "change-me-to-a-long-random-string-32chars-min"
  bffServiceToken: "change-me-to-a-long-random-string"
  bffServiceTokenDisabled: ""
  # Prefer: helm ... --set-file secrets.fudaSigningKey=apps/fuda/keys/dev.pem
  fudaSigningKey: |
    -----BEGIN PRIVATE KEY-----
    (replace with real PEM or use --set-file)
    -----END PRIVATE KEY-----
