apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# OrbStack Kubernetes shares the local Docker image store — IfNotPresent
# (base default) is enough. Expose the BFF via LoadBalancer (OrbStack
# publishes it on localhost). SQLite uses hostPath to apps/*/data (same
# dirs as native local runs; patch generated by up.sh).
patches:
  - path: patch-keidai-ui-service.yaml
  - path: delete-pvcs.yaml
  - path: patch-hostpath-volumes.yaml
