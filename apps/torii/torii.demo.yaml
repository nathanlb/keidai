# Demo gateway config — open-torii status digest scenario (NAT-16).
#
# Loaded via TORII_CONFIG_PATH=./torii.demo.yaml (compose) or the k8s ConfigMap
# mount (see deploy/k8s/base/). Keep this file and deploy/k8s/base/torii.demo.yaml
# in sync when changing demo gateway config.
#
# Link OAuth providers via the keidai-ui OAuth providers screen before running
# the demo. Register provider callback URLs as
# {gateway_base}/oauth/callback/{provider}. With the BFF edge that is
# http://localhost:3000/oauth/callback/... (compose and kind). Direct Torii
# :3100 callbacks are only for local Torii-without-BFF experiments.
#
# Agent identity lives in Fuda (management API / keidai-ui). See the Demo
# section in the repo root README.md.

oauth_providers:
  github:
    token_url: https://github.com/login/oauth/access_token
    client_id: ${env:GITHUB_CLIENT_ID}
    client_secret: ${env:GITHUB_CLIENT_SECRET}
    scopes: [repo, read:user]

  notion:
    authorize_url: https://mcp.notion.com/authorize
    token_url: https://mcp.notion.com/token
    registration_endpoint: https://mcp.notion.com/register
    scopes: []

  google:
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    client_id: ${env:GOOGLE_CLIENT_ID}
    client_secret: ${env:GOOGLE_CLIENT_SECRET}
    scopes:
      # Gmail MCP requires compose (not drafts) — see Google Workspace MCP docs.
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/gmail.compose
      - https://www.googleapis.com/auth/gmail.drafts
    authorize_params:
      access_type: offline
      prompt: consent

servers:
  - name: linear
    transport:
      type: http
      url: https://mcp.linear.app/mcp
    credential:
      strategy: service_key
      key: ${env:LINEAR_API_KEY}

  - name: github
    transport:
      type: http
      url: https://api.githubcopilot.com/mcp/
    credential:
      strategy: user_oauth
      provider: github

  - name: notion
    transport:
      type: http
      url: https://mcp.notion.com/mcp
    credential:
      strategy: user_oauth
      provider: notion

  - name: gmail
    # Google managed Gmail MCP (developer preview) — no local sidecar required.
    transport:
      type: http
      url: https://gmailmcp.googleapis.com/mcp/v1
    credential:
      strategy: user_oauth
      provider: google
