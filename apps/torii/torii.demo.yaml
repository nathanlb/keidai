# Demo gateway config — open-torii status digest scenario (NAT-16).
#
# Loaded via TORII_CONFIG_PATH=./torii.demo.yaml in apps/torii/.env
#
# Link OAuth providers via the keidai-ui OAuth providers screen before running
# the demo. For GitHub and Google, register the gateway callback URL in each
# provider's developer console: {gateway_base}/oauth/callback/{provider}
# (default local: http://127.0.0.1:3100/oauth/callback/github, etc.)
#
# Agent identity lives in Fuda (see apps/fuda/fuda.seed.example.yaml).
# See the Demo section in the repo root README.md for the full walkthrough.

oauth_providers:
  github:
    token_url: https://github.com/login/oauth/access_token
    client_id: ${env:GITHUB_CLIENT_ID}
    client_secret: ${env:GITHUB_CLIENT_SECRET}
    scopes: [repo, read:user]

  notion:
    authorize_url: https://mcp.notion.com/authorize
    token_url: https://mcp.notion.com/token
    registration_endpoint: https://mcp.notion.com/register
    scopes: []

  google:
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    client_id: ${env:GOOGLE_CLIENT_ID}
    client_secret: ${env:GOOGLE_CLIENT_SECRET}
    scopes:
      # Gmail MCP requires compose (not drafts) — see Google Workspace MCP docs.
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/gmail.compose
      - https://www.googleapis.com/auth/gmail.drafts
    authorize_params:
      access_type: offline
      prompt: consent

servers:
  - name: linear
    transport:
      type: http
      url: https://mcp.linear.app/mcp
    credential:
      strategy: service_key
      key: ${env:LINEAR_API_KEY}

  - name: github
    transport:
      type: http
      url: https://api.githubcopilot.com/mcp/
    credential:
      strategy: user_oauth
      provider: github

  - name: notion
    transport:
      type: http
      url: https://mcp.notion.com/mcp
    credential:
      strategy: user_oauth
      provider: notion

  - name: gmail
    # Google managed Gmail MCP (developer preview) — no local sidecar required.
    transport:
      type: http
      url: https://gmailmcp.googleapis.com/mcp/v1
    credential:
      strategy: user_oauth
      provider: google

groups:
  - name: agents
    description: Demo agent access for the open-torii digest scenario
    permissions:
      - server: linear
        tools: [list_issues, get_issue, list_projects, list_initiatives]
      - server: github
        tools: [search_issues, get_file_contents]
      - server: notion
        tools: [notion-search, notion-fetch]
      - server: gmail
        tools: [create_draft, list_drafts]

# Owner used for boot-time backend connections and catalog refresh.
boot_owner_id: demo-owner

# Tools that require human approval before Torii proxies upstream,
# keyed by Fuda agent id (see fuda.seed.example.yaml).
gated_tools:
  shaiden-newsletter-01:
    - gmail.create_draft
