# Fuda one-way seed file (NAT-121).
#
# Dev/demo setup utility — not part of the production fuda server bin.
#
# Apply with:
#   pnpm --filter @keidai/fuda seed -- ./apps/fuda/fuda.seed.example.yaml
#
# Demo reset (DB wipe + seed):
#   rm -f "${FUDA_DB_PATH:-./apps/fuda/data/fuda.db}" && \
#     pnpm --filter @keidai/fuda seed -- ./apps/fuda/fuda.seed.example.yaml
#
# Torii registration fields (subject, inbound_token, gated_tools) are accepted
# and ignored — credential → bearer mapping stays in the subject validator env.

agents:
  - agent_id: demo-agent-01
    slug: demo-agent
    name: Demo agent
    owner_id: demo-owner
    groups: [agents]
    persona: |
      You are the demo agent for local Keidai walks.
    subject:
      kind: k8s_service_account
      namespace: torii-agents
      service_account: demo-agent
    inbound_token: ${env:DEMO_AGENT_BEARER}

  - agent_id: shaiden-newsletter-01
    slug: shaiden-newsletter
    name: Shaiden newsletter
    owner_id: demo-owner
    groups: [agents]
    persona: |
      You draft a short weekly newsletter from linked tools.
    subject:
      kind: k8s_service_account
      namespace: torii-agents
      service_account: shaiden
    inbound_token: ${env:SHAIDEN_BEARER}
    gated_tools:
      - gmail.create_draft

bearers:
  - bearer_id: local-dev
    display_name: Local dev

grants:
  - bearer_id: local-dev
    agent_id: demo-agent-01
  - bearer_id: local-dev
    agent_id: shaiden-newsletter-01
